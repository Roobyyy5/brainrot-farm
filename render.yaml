services:
  - type: web
    name: brainrot-farm-app
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false

  - type: web
    name: brainrot-farm-bot
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OWNER_CHAT_ID
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: PGSSL
        value: true
